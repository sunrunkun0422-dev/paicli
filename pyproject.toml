[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paicli"
version = "0.1.0"
description = "PaiCLI Python migration: a repository-aware ReAct coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "PaiCLI contributors" }]
dependencies = []

[project.scripts]
paicli = "paicli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["paicli*"]
